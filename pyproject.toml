[project]
name = "research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Satyam Bansal", email = "satyambansal008@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.30",
    "fastapi>=0.162.0",
    "sse-starlette>=3.2.0",
    "pydantic-settings>=2.16.1",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
research-assistant = "research_assistant:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
